<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إدارة وربط الدومينات - Vercel API</title>
    <style>
        :root {
            --primary: #0070f3;
            --primary-hover: #0051a2;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --success-text: #065f46;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #991b1b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 32px;
            max-width: 500px;
            width: 100%;
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 700;
        }

        p.desc {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--bg);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
        }

        .hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
        }

        .result-box.success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .result-box.error {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
        }

        code {
            background-color: rgba(0, 0, 0, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            direction: ltr;
            display: inline-block;
            font-size: 13px;
        }

        .remember-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ربط الدومينات المخصصة</h2>
        <p class="desc">أدخل بيانات مفتاح الربط والمعرف الخاص بمشروعك لمرة واحدة، ثم ابدأ بربط دومينات المتاجر تلقائياً.</p>

        <form id="domainForm">
            <div class="section-title">🔑 بيانات الإعدادات (تُحفظ في متصفحك فقط)</div>
            
            <div class="form-group">
                <label for="vercelToken">Vercel API Token الجديد:</label>
                <input type="password" id="vercelToken" placeholder="vcp_xxxxxxxxxxxxxxxxxxxx" required>
                <div class="hint">يتم استخراجه من Account Settings ➔ Tokens.</div>
            </div>

            <div class="form-group">
                <label for="projectId">Project ID (معرف المشروع):</label>
                <input type="text" id="projectId" placeholder="prj_xxxxxxxxxxxxxxxxxxxx" required>
                <div class="hint">يتم استخراجه من إعدادات المشروع ➔ عام (General).</div>
            </div>

            <div class="remember-group">
                <input type="checkbox" id="saveCredentials" checked>
                <label for="saveCredentials" style="margin: 0; cursor: pointer;">حفظ البيانات في المتصفح لاستخدامها لاحقاً</label>
            </div>

            <div class="section-title">🌐 بيانات الدومين المراد ربطه</div>

            <div class="form-group">
                <label for="domainName">اسم دومين المتجر:</label>
                <input type="text" id="domainName" placeholder="my-store-yemen.com" required>
            </div>

            <button type="submit" id="submitBtn">ربط الدومين الآن</button>
        </form>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        // معرّف الفريق التابع لحسابك
        const TEAM_ID = "team_s7oNokqtDyYu1UzMBtHuJgnU";

        const form = document.getElementById('domainForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        const tokenInput = document.getElementById('vercelToken');
        const projectIdInput = document.getElementById('projectId');
        const saveCheckbox = document.getElementById('saveCredentials');

        // استرجاع البيانات المحفوظة تلقائياً عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('vcp_token');
            const savedProjectId = localStorage.getItem('vcp_project_id');

            if (savedToken) tokenInput.value = savedToken;
            if (savedProjectId) projectIdInput.value = savedProjectId;
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const token = tokenInput.value.trim();
            const projectId = projectIdInput.value.trim();
            const domainName = document.getElementById('domainName').value.trim();

            // حفظ الإعدادات في متصفح المستخدم عند تحديد الخيار
            if (saveCheckbox.checked) {
                localStorage.setItem('vcp_token', token);
                localStorage.setItem('vcp_project_id', projectId);
            } else {
                localStorage.removeItem('vcp_token');
                localStorage.removeItem('vcp_project_id');
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الاتصال بـ Vercel...';
            resultBox.style.display = 'none';

            try {
                // إضافة teamId لتوافق طلبات حسابات الفرق (Team Scopes)
                const response = await fetch(`https://api.vercel.com/v9/projects/${projectId}/domains?teamId=${TEAM_ID}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: domainName })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(`
                        <strong>تم ربط الدومين بنجاح! 🎉</strong><br><br>
                        الدومين: <code>${data.name}</code><br>
                        الخطوة التالية: وجه سجل CNAME في لوحة تحكم الدومين إلى:<br>
                        <code>cname.vercel-dns.com</code>
                    `, true);
                } else {
                    const errorMsg = data.error ? data.error.message : 'فشل الربط، تحقق من صحة المفتاح والـ Project ID';
                    showResult(`خطأ من Vercel: ${errorMsg}`, false);
                }
            } catch (error) {
                showResult('حدث خطأ في الاتصال بالشبكة أو تم حظر الطلب من المتصفح (CORS)', false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'ربط الدومين الآن';
            }
        });

        function showResult(message, isSuccess) {
            resultBox.innerHTML = message;
            resultBox.className = 'result-box ' + (isSuccess ? 'success' : 'error');
            resultBox.style.display = 'block';
        }
    </script>

</body>
</html>
