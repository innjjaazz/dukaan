<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة ربط الدومينات - Vercel API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #111; font-size: 22px; }
        p { color: #666; font-size: 14px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 13px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #0070f3; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-size: 14px; }
        .result-box.success { background-color: #e6fffa; border: 1px solid #b2f5ea; color: #234e52; }
        .result-box.error { background-color: #fff5f5; border: 1px solid #feb2b2; color: #9b2c2c; }
        code { background-color: rgba(0, 0, 0, 0.05); padding: 2px 6px; border-radius: 4px; font-family: monospace; direction: ltr; display: inline-block; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ربط دومين مخصص - Vercel API</h2>
        <p>قم بإدخال بيانات الاعتماد واختبار ربط الدومينات مباشرة:</p>

        <form id="domainForm">
            <div class="form-group">
                <label for="vercelToken">Vercel API Token:</label>
                <input type="password" id="vercelToken" placeholder="vcp_xxxxxxxxxxxx" required>
            </div>

            <div class="form-group">
                <label for="projectId">Project ID (معرف المشروع):</label>
                <input type="text" id="projectId" placeholder="prj_xxxxxxxxxxxx" required>
            </div>

            <div class="form-group">
                <label for="domainName">اسم الدومين المراد ربطه:</label>
                <input type="text" id="domainName" placeholder="my-store-yemen.com" required>
            </div>

            <button type="submit" id="submitBtn">ربط الدومين الآن</button>
        </form>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        const form = document.getElementById('domainForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const token = document.getElementById('vercelToken').value.trim();
            const projectId = document.getElementById('projectId').value.trim();
            const domainName = document.getElementById('domainName').value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الاتصال بـ Vercel...';
            resultBox.style.display = 'none';

            try {
                const response = await fetch(`https://api.vercel.com/v9/projects/${projectId}/domains`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: domainName })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(`
                        <strong>تم ربط الدومين بنجاح! 🎉</strong><br><br>
                        الدومين: <code>${data.name}</code><br>
                        وجه سجل CNAME إلى: <code>cname.vercel-dns.com</code>
                    `, true);
                } else {
                    const errorMsg = data.error ? data.error.message : 'فشل الربط، تحقق من صحة البيانات';
                    showResult(`خطأ من Vercel: ${errorMsg}`, false);
                }
            } catch (error) {
                showResult('حدث خطأ في الاتصال، قد يكون السبب حظر CORS من المتصفح عند الاستدعاء المباشر', false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'ربط الدومين الآن';
            }
        });

        function showResult(message, isSuccess) {
            resultBox.innerHTML = message;
            resultBox.className = 'result-box ' + (isSuccess ? 'success' : 'error');
            resultBox.style.display = 'block';
        }
    </script>

</body>
</html>
